name: Validate examples

on:
  pull_request:
    paths:
      - 'examples/**'
      - 'email-format.regex'
      - 'validate-email-regex.py'
      - 'validate-uri-formats.py'
      - 'validate-examples.py'
      - 'requirements.txt'

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          failed=0
          for f in examples/*.json; do
            if python -m json.tool "$f" > /dev/null 2>&1; then
              echo "OK: $f"
            else
              echo "INVALID: $f"
              failed=1
            fi
          done
          exit $failed

  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate example schemas against the 2020-12 meta-schema
        run: python validate-examples.py

  test-email-regex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test email regex against example addresses
        run: python validate-email-regex.py

  test-uri-formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check URI and IRI cases against the RFC grammars
        run: python validate-uri-formats.py
